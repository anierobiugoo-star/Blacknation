<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/calcu.css">
</head>
<body>
 
    <div class="calculator" role="application" aria-label="Calculator">

        <!-- Display -->
        <div class="display" aria-live="polite" aria-atomic="true">
            <div class="expression" id="expression"></div>
            <div class="result" id="result">0</div>
        </div>

        <!-- Buttons -->
        <div class="buttons">

            <!-- Row 1 -->
            <button class="btn btn-clear" data-action="clear" aria-label="Clear">AC</button>
            <button class="btn btn-operator" data-action="operator" data-value="tan">tan</button>
            <button class="btn btn-operator" data-action="operator" data-value="sin">sin</button>
            <button class="btn btn-operator" data-action="operator" data-value="cos">cos</button>
            <button class="btn btn-operator" data-action="operator" data-value="log">log</button>
            
            

            <!-- Row 2 -->
            <button class="btn btn-operator" data-action="operator" data-value="%">%</button> 
            <button class="btn" data-action="digit" data-value="9">9</button>
            <button class="btn" data-action="digit" data-value="8">8</button>
            <button class="btn" data-action="digit" data-value="7">7</button>
            <button class="btn" data-action="digit" data-value="6">6</button>
            <button class="btn btn-operator" data-action="operator" data-value="÷">÷</button>
             
            

            <!-- Row 3 -->
             <button class="btn btn-operator" data-action="operator" data-value="×">×</button>
            <button class="btn" data-action="digit" data-value="5">5</button>
            <button class="btn" data-action="digit" data-value="4">4</button>
            <button class="btn" data-action="digit" data-value="3">3</button>
            <button class="btn" data-action="digit" data-value="2">2</button>
            <button class="btn" data-action="digit" data-value="1">1</button>
            <button class="btn btn-operator" data-action="operator" data-value="-">−</button> 
            

            <!-- Row 4 -->
            <button class="btn" data-action="decimal" data-value=".">.</button>
            <button class="btn btn-zero" data-action="digit" data-value="0">0</button>
            <button class="btn btn-operator" data-action="operator" data-value="+">+</button>
            <button class="btn btn-equals" data-action="equals" aria-label="Equals">=</button>
            

        </div>
    </div>
    <script>
    </script>
    
    
    <script src="/js/script.js"></script>


</body>
</html>
