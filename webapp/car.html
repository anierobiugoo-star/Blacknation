<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="car.css">
    
</head>
<body>
    <div class="calculator" role="application" aria-label="Calculator">
  <div class="screen">
    <div class="expression" id="expression" aria-hidden="true"></div>
    <div class="display" id="display" data-size="lg" aria-live="polite">0</div>
  </div>

  <div class="keys" id="keys">
    <button class="key key--fn" data-action="clear"     aria-label="Clear all">AC</button>
    <button class="key key--fn" data-action="backspace" aria-label="Backspace">⌫</button>
    <button class="key key--fn" data-action="percent"   aria-label="Percent">%</button>
    <button class="key key--op" data-action="operator" data-op="÷" aria-label="Divide">÷</button>

    <button class="key" data-action="digit" data-digit="7">7</button>
    <button class="key" data-action="digit" data-digit="8">8</button>
    <button class="key" data-action="digit" data-digit="9">9</button>
    <button class="key key--op" data-action="operator" data-op="×" aria-label="Multiply">×</button>

    <button class="key" data-action="digit" data-digit="4">4</button>
    <button class="key" data-action="digit" data-digit="5">5</button>
    <button class="key" data-action="digit" data-digit="6">6</button>
    <button class="key key--op" data-action="operator" data-op="-" aria-label="Subtract">−</button>

    <button class="key" data-action="digit" data-digit="1">1</button>
    <button class="key" data-action="digit" data-digit="2">2</button>
    <button class="key" data-action="digit" data-digit="3">3</button>
    <button class="key key--op" data-action="operator" data-op="+" aria-label="Add">+</button>

    <button class="key key--fn" data-action="sign"    aria-label="Toggle sign">±</button>
    <button class="key" data-action="digit" data-digit="0">0</button>
    <button class="key" data-action="decimal"         aria-label="Decimal point">.</button>
    <button class="key key--eq" data-action="equals"  aria-label="Equals">=</button>
  </div>
</div>
</body>
</html>
