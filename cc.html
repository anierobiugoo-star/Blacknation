<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculator</title>
<style>
  *,
  *::before,
  *::after { box-sizing: border-box; }

  :root {
    --key:        #252a3a;
    --key-hover:  #2f3549;
    --fn:         #333a50;
    --fn-hover:   #3d4560;
    --text:       #eef2ff;
    --muted:      #7e88a8;
    --accent:     #ff9a4d;
    --accent-2:   #ff7a1a;
  }

  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    display: grid;
    place-items: center;
    padding: 20px;
    background:
      radial-gradient(1200px 600px at 15% 0%, #2b3350 0%, transparent 55%),
      radial-gradient(900px 500px at 85% 100%, #3a2338 0%, transparent 55%),
      linear-gradient(160deg, #14171f, #08090d);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- Shell ---------- */
  .calculator {
    width: min(360px, 100%);
    padding: 20px;
    border-radius: 28px;
    background: linear-gradient(165deg, #1d2130 0%, #12151e 100%);
    border: 1px solid rgba(255, 255, 255, .07);
    box-shadow:
      0 40px 80px -30px rgba(0, 0, 0, .9),
      0 1px 0 rgba(255, 255, 255, .06) inset,
      0 -1px 0 rgba(0, 0, 0, .5) inset;
  }

  /* ---------- Screen ---------- */
  .screen {
    padding: 16px 18px 14px;
    margin-bottom: 16px;
    border-radius: 18px;
    background: rgba(0, 0, 0, .35);
    border: 1px solid rgba(255, 255, 255, .05);
    box-shadow: 0 1px 0 rgba(255, 255, 255, .04) inset;
    text-align: right;
    overflow: hidden;
  }

  .expression {
    min-height: 22px;
    font-size: .95rem;
    line-height: 22px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .display {
    font-size: 48px;
    line-height: 1.15;
    font-weight: 500;
    letter-spacing: -.01em;
    color: #f3f6ff;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    overflow: hidden;
    transition: font-size .12s ease;
  }

  .display[data-size="md"] { font-size: 38px; }
  .display[data-size="sm"] { font-size: 31px; }
  .display[data-size="xs"] { font-size: 26px; }

  /* ---------- Keypad ---------- */
  .keys {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }

  .key {
    display: flex;
    align-items: center;
    justify-content: center;
    aspect-ratio: 1 / 1;
    border: none;
    border-radius: 16px;
    background: var(--key);
    color: var(--text);
    font: inherit;
    font-size: 1.4rem;
    font-weight: 500;
    cursor: pointer;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    transition: background-color .15s ease, transform .08s ease, filter .15s ease;
    box-shadow:
      0 1px 0 rgba(255, 255, 255, .06) inset,
      0 2px 6px rgba(0, 0, 0, .25);
  }

  .key:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .key--fn {
    background: var(--fn);
    color: #a9b3d1;
    font-size: 1.15rem;
    font-weight: 600;
  }

  .key--op {
    background: rgba(255, 154, 77, .14);
    color: var(--accent);
    font-size: 1.5rem;
    font-weight: 600;
  }

  .key--eq {
    background: linear-gradient(160deg, #ffb066, var(--accent-2));
    color: #1b1005;
    font-size: 1.5rem;
    font-weight: 700;
    box-shadow:
      0 6px 18px -6px rgba(255, 122, 26, .8),
      0 1px 0 rgba(255, 255, 255, .35) inset;
  }

  @media (hover: hover) {
    .key:hover        { background-color: var(--key-hover); }
    .key--fn:hover    { background-color: var(--fn-hover); }
    .key--op:hover    { background-color: rgba(255, 154, 77, .24); }
    .key--eq:hover    { filter: brightness(1.07); }
  }

  .key:active,
  .key.is-active {
    transform: scale(.94);
    filter: brightness(1.15);
  }

  /* ---------- Short screens ---------- */
  @media (max-height: 680px) {
    .calculator     { width: min(320px, 100%); padding: 14px; border-radius: 22px; }
    .screen         { padding: 12px 14px 10px; margin-bottom: 12px; }
    .keys           { gap: 8px; }
    .key            { border-radius: 13px; font-size: 1.2rem; }
    .key--op,
    .key--eq        { font-size: 1.3rem; }
    .key--fn        { font-size: 1rem; }
    .display        { font-size: 40px; }
    .display[data-size="md"] { font-size: 33px; }
    .display[data-size="sm"] { font-size: 27px; }
    .display[data-size="xs"] { font-size: 22px; }
  }
</style>
</head>
<body>

<div class="calculator" role="application" aria-label="Calculator">
  <div class="screen">
    <div class="expression" id="expression" aria-hidden="true"></div>
    <div class="display" id="display" data-size="lg" aria-live="polite">0</div>
  </div>

  <div class="keys" id="keys">
    <button class="key key--fn" data-action="clear"     aria-label="Clear all">AC</button>
    <button class="key key--fn" data-action="backspace" aria-label="Backspace">⌫</button>
    <button class="key key--fn" data-action="percent"   aria-label="Percent">%</button>
    <button class="key key--op" data-action="operator" data-op="÷" aria-label="Divide">÷</button>

    <button class="key" data-action="digit" data-digit="7">7</button>
    <button class="key" data-action="digit" data-digit="8">8</button>
    <button class="key" data-action="digit" data-digit="9">9</button>
    <button class="key key--op" data-action="operator" data-op="×" aria-label="Multiply">×</button>

    <button class="key" data-action="digit" data-digit="4">4</button>
    <button class="key" data-action="digit" data-digit="5">5</button>
    <button class="key" data-action="digit" data-digit="6">6</button>
    <button class="key key--op" data-action="operator" data-op="-" aria-label="Subtract">−</button>

    <button class="key" data-action="digit" data-digit="1">1</button>
    <button class="key" data-action="digit" data-digit="2">2</button>
    <button class="key" data-action="digit" data-digit="3">3</button>
    <button class="key key--op" data-action="operator" data-op="+" aria-label="Add">+</button>

    <button class="key key--fn" data-action="sign"    aria-label="Toggle sign">±</button>
    <button class="key" data-action="digit" data-digit="0">0</button>
    <button class="key" data-action="decimal"         aria-label="Decimal point">.</button>
    <button class="key key--eq" data-action="equals"  aria-label="Equals">=</button>
  </div>
</div>

<script>
(function () {
  'use strict';

  const displayEl    = document.getElementById('display');
  const expressionEl = document.getElementById('expression');
  const keysEl       = document.getElementById('keys');

  const MAX_DIGITS = 12;
  const OP_LABEL   = { '+': '+', '-': '−', '×': '×', '÷': '÷' };

  const state = {
    current:      '0',    // what's on screen (raw string while typing)
    previous:     null,   // stored left-hand operand
    operator:     null,   // '+', '-', '×', '÷'
    overwrite:    true,   // next digit replaces `current`
    lastOperand:  null,   // for repeated "=" presses
    lastOperator: null,
  };

  /* ---------------- Helpers ---------------- */

  function formatNumber(num) {
    if (!Number.isFinite(num)) return 'Error';
    if (num === 0) return '0';

    const abs = Math.abs(num);
    if (abs >= 1e12 || abs < 1e-9) {
      return num.toExponential(6).replace(/\.?0+e/, 'e');
    }
    // 12 significant digits kills floating-point noise (0.1 + 0.2)
    return String(parseFloat(num.toPrecision(12)));
  }

  function compute(a, b, op) {
    switch (op) {
      case '+': return a + b;
      case '-': return a - b;
      case '×': return a * b;
      case '÷': return b === 0 ? NaN : a / b;
      default:  return NaN;
    }
  }

  function render() {
    const text = state.current;
    displayEl.textContent = text;

    const len = text.length;
    displayEl.dataset.size =
      len > 13 ? 'xs' :
      len > 10 ? 'sm' :
      len > 8  ? 'md' : 'lg';
  }

  function setExpression(text) {
    expressionEl.textContent = text || '';
  }

  function setError() {
    state.current      = 'Error';
    state.previous     = null;
    state.operator     = null;
    state.overwrite    = true;
    state.lastOperand  = null;
    state.lastOperator = null;
    setExpression('');
    render();
  }

  /* ---------------- Actions ---------------- */

  function inputDigit(d) {
    if (state.current === 'Error') clearAll();

    if (state.overwrite || /[eE]/.test(state.current)) {
      if (state.operator === null) setExpression('');
      state.current   = d;
      state.overwrite = false;
    } else {
      const digitCount = state.current.replace(/[-.]/g, '').length;
      if (digitCount >= MAX_DIGITS) return;
      state.current = state.current === '0' ? d : state.current + d;
    }
    render();
  }

  function inputDecimal() {
    if (state.current === 'Error') clearAll();

    if (state.overwrite || /[eE]/.test(state.current)) {
      if (state.operator === null) setExpression('');
      state.current   = '0.';
      state.overwrite = false;
    } else if (!state.current.includes('.')) {
      state.current += '.';
    }
    render();
  }

  function chooseOperator(op) {
    if (state.current === 'Error') return;

    const value = parseFloat(state.current);

    if (state.operator !== null && !state.overwrite) {
      const result = compute(state.previous, value, state.operator);
      if (!Number.isFinite(result)) { setError(); return; }
      state.previous = result;
      state.current  = formatNumber(result);
    } else {
      state.previous = value;
    }

    state.operator     = op;
    state.overwrite    = true;
    state.lastOperand  = null;
    state.lastOperator = null;

    setExpression(`${formatNumber(state.previous)} ${OP_LABEL[op]}`);
    render();
  }

  function equals() {
    if (state.current === 'Error') return;

    let a, b, op;

    if (state.operator !== null) {
      a  = state.previous;
      b  = parseFloat(state.current);
      op = state.operator;
    } else if (state.lastOperator !== null) {
      // pressing "=" again repeats the previous operation
      a  = parseFloat(state.current);
      b  = state.lastOperand;
      op = state.lastOperator;
    } else {
      return;
    }

    const result = compute(a, b, op);
    if (!Number.isFinite(result)) { setError(); return; }

    state.lastOperator = op;
    state.lastOperand  = b;
    state.current      = formatNumber(result);
    state.previous     = null;
    state.operator     = null;
    state.overwrite    = true;

    setExpression(`${formatNumber(a)} ${OP_LABEL[op]} ${formatNumber(b)} =`);
    render();
  }

  function clearAll() {
    state.current      = '0';
    state.previous     = null;
    state.operator     = null;
    state.overwrite    = true;
    state.lastOperand  = null;
    state.lastOperator = null;
    setExpression('');
    render();
  }

  function backspace() {
    if (state.current === 'Error') { clearAll(); return; }
    if (state.overwrite) return;

    state.current = state.current.slice(0, -1);
    if (state.current === '' || state.current === '-') {
      state.current   = '0';
      state.overwrite = true;
    }
    render();
  }

  function percent() {
    if (state.current === 'Error') return;
    const value = parseFloat(state.current) / 100;
    state.current   = formatNumber(value);
    state.overwrite = false;
    render();
  }

  function toggleSign() {
    if (state.current === 'Error' || state.current === '0') return;
    state.current = state.current.startsWith('-')
      ? state.current.slice(1)
      : '-' + state.current;
    render();
  }

  /* ---------------- Events ---------------- */

  function handleAction(action, dataset) {
    switch (action) {
      case 'digit':     inputDigit(dataset.digit);  break;
      case 'decimal':   inputDecimal();             break;
      case 'operator':  chooseOperator(dataset.op); break;
      case 'equals':    equals();                   break;
      case 'clear':     clearAll();                 break;
      case 'backspace': backspace();                break;
      case 'sign':      toggleSign();               break;
      case 'percent':   percent();                  break;
    }
  }

  keysEl.addEventListener('click', function (e) {
    const btn = e.target.closest('button.key');
    if (!btn) return;
    handleAction(btn.dataset.action, btn.dataset);
  });

  function flash(selector) {
    const btn = keysEl.querySelector(selector);
    if (!btn) return;
    btn.classList.add('is-active');
    setTimeout(() => btn.classList.remove('is-active'), 110);
  }

  window.addEventListener('keydown', function (e) {
    if (e.ctrlKey || e.metaKey || e.altKey) return;

    const k = e.key;
    let selector = null;

    if (/^[0-9]$/.test(k)) {
      inputDigit(k);
      selector = `[data-digit="${k}"]`;
    } else if (k === '.' || k === ',') {
      inputDecimal();
      selector = '[data-action="decimal"]';
    } else if (k === '+') {
      chooseOperator('+');
      selector = '[data-op="+"]';
    } else if (k === '-') {
      chooseOperator('-');
      selector = '[data-op="-"]';
    } else if (k === '*' || k === 'x' || k === 'X') {
      chooseOperator('×');
      selector = '[data-op="×"]';
    } else if (k === '/') {
      e.preventDefault();
      chooseOperator('÷');
      selector = '[data-op="÷"]';
    } else if (k === 'Enter' || k === '=') {
      e.preventDefault();
      equals();
      selector = '[data-action="equals"]';
    } else if (k === 'Backspace') {
      backspace();
      selector = '[data-action="backspace"]';
    } else if (k === 'Escape' || k === 'Delete') {
      clearAll();
      selector = '[data-action="clear"]';
    } else if (k === '%') {
      percent();
      selector = '[data-action="percent"]';
    } else {
      return;
    }

    if (selector) flash(selector);
  });

  /* ---------------- Init ---------------- */
  render();
})();
</script>
</body>
</html>
